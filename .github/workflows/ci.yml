name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Typecheck & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Dependency audit
        run: npm audit --audit-level=high

      # The web dashboard is a separate npm project from the backend above -
      # its own tsc/vite build only otherwise runs inside the Docker image
      # build below, which is slower and only signals failure via the whole
      # smoke-build step. Checking it here fails fast on a plain type error.
      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck web
        working-directory: web
        run: npx tsc --noEmit

      - name: Dependency audit (web)
        working-directory: web
        run: npm audit --audit-level=high

  publish:
    name: Build, smoke test, and publish
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute lowercase GHCR image name
        if: github.event_name == 'push'
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: github.event_name == 'push'
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Mirrored to Docker Hub (public) alongside GHCR so pull-count/version
      # badges have a source to read from - GHCR doesn't expose that metric.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        if: github.event_name == 'push'
        id: meta
        with:
          images: |
            ${{ steps.image.outputs.name }}
            docker.io/honeybeartech/plex-director-mcp
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' }}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Loaded locally (not pushed) so a boot failure - e.g. the two Dockerfile
      # stages drifting to incompatible Node ABIs, which Dependabot can't know
      # not to do since it tracks each FROM line independently - is caught
      # before anything reaches a public registry. Runs on PRs too (including
      # Dependabot's), not just after merge to main, so a breaking bump gets
      # caught before it lands rather than after.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: smoke-build
        with:
          context: .
          load: true
          tags: smoke-test:latest

      - name: Smoke test - verify the image boots
        run: |
          docker run -d --name smoke-test \
            -e RADARR_URL=http://smoke-test.invalid -e RADARR_API_KEY=dummy \
            -e SABNZBD_URL=http://smoke-test.invalid -e SABNZBD_API_KEY=dummy \
            -e TAUTULLI_URL=http://smoke-test.invalid -e TAUTULLI_API_KEY=dummy \
            -e TMDB_API_KEY=dummy \
            -e PROWLARR_URL=http://smoke-test.invalid -e PROWLARR_API_KEY=dummy \
            -p 3000:3000 \
            smoke-test:latest

          stdio_ok=""
          web_ok=""
          for i in $(seq 1 10); do
            if [ -z "$stdio_ok" ] && docker logs smoke-test 2>&1 | grep -q "Plex Director MCP server running on Stdio"; then
              stdio_ok=1
            fi
            if [ -z "$web_ok" ] && curl -sf http://localhost:3000/healthz > /dev/null 2>&1; then
              web_ok=1
            fi
            if [ -n "$stdio_ok" ] && [ -n "$web_ok" ]; then
              echo "Smoke test passed (stdio + web UI both up)"
              docker rm -f smoke-test
              exit 0
            fi
            sleep 1
          done

          echo "::error::Smoke test failed within 10s - stdio ready: ${stdio_ok:-no}, web UI ready: ${web_ok:-no}"
          docker logs smoke-test
          docker rm -f smoke-test
          exit 1

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: github.event_name == 'push'
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Non-blocking for now (exit-code: false) so a baseline can be reviewed
      # before deciding whether to gate the pipeline on it. Results land in
      # this job's summary. Flip exit-code to true once you're ready to fail
      # the build on new critical/high CVEs. Pinned to amd64 since CVE data
      # doesn't differ meaningfully by architecture and scanning both would
      # just double this step's runtime.
      - name: Docker Scout - CVE scan
        if: github.event_name == 'push'
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1
        with:
          command: cves
          image: docker.io/honeybeartech/plex-director-mcp@${{ steps.build.outputs.digest }}
          platform: linux/amd64
          only-severities: critical,high
          exit-code: false

      # Keyless signing via GitHub's OIDC token (no key management) - lets
      # anyone verify an image genuinely came from this repo's workflow, e.g.
      # `cosign verify --certificate-identity-regexp ... ghcr.io/.../plex-director-mcp@sha256:...`.
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        if: github.event_name == 'push'

      - name: Sign the published images
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${{ steps.image.outputs.name }}@${DIGEST}"
          cosign sign --yes "docker.io/honeybeartech/plex-director-mcp@${DIGEST}"

  release:
    name: Create GitHub Release
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
