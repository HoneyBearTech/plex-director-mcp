version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The web dashboard is a separate npm project (own package.json/lockfile)
  # from the backend above - without its own entry here, React/Vite/Radix
  # Themes and the rest of its dependency tree never get update PRs.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The builder stage (node:*-slim) and runtime stage (a distroless
      # image with its own independent Node version) have to move in
      # lockstep, but Dependabot tracks each FROM line separately and can't
      # know that - a major bump here needs to be coordinated by hand with
      # whatever distroless nodejs variant is available.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
