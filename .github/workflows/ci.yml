name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Dependency audit
        run: npm audit --audit-level=high

  publish:
    name: Build & push Docker image
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Compute lowercase GHCR image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Mirrored to Docker Hub (public) alongside GHCR so pull-count/version
      # badges have a source to read from - GHCR doesn't expose that metric.
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            ${{ steps.image.outputs.name }}
            docker.io/honeybeartech/plex-director-mcp
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' }}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Loaded locally (not pushed) so a boot failure - e.g. the two Dockerfile
      # stages drifting to incompatible Node ABIs, which Dependabot can't know
      # not to do since it tracks each FROM line independently - is caught
      # before anything reaches a public registry.
      - uses: docker/build-push-action@v6
        id: smoke-build
        with:
          context: .
          load: true
          tags: smoke-test:latest

      - name: Smoke test - verify the image boots
        run: |
          docker run -d --name smoke-test \
            -e RADARR_URL=http://smoke-test.invalid -e RADARR_API_KEY=dummy \
            -e SABNZBD_URL=http://smoke-test.invalid -e SABNZBD_API_KEY=dummy \
            -e TAUTULLI_URL=http://smoke-test.invalid -e TAUTULLI_API_KEY=dummy \
            -e TMDB_API_KEY=dummy \
            -e PROWLARR_URL=http://smoke-test.invalid -e PROWLARR_API_KEY=dummy \
            smoke-test:latest

          for i in $(seq 1 10); do
            if docker logs smoke-test 2>&1 | grep -q "Plex Director MCP server running on Stdio"; then
              echo "Smoke test passed"
              docker rm -f smoke-test
              exit 0
            fi
            sleep 1
          done

          echo "::error::Smoke test failed - server did not reach ready state within 10s"
          docker logs smoke-test
          docker rm -f smoke-test
          exit 1

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Non-blocking for now (exit-code: false) so a baseline can be reviewed
      # before deciding whether to gate the pipeline on it. Results land in
      # this job's summary. Flip exit-code to true once you're ready to fail
      # the build on new critical/high CVEs. Pinned to amd64 since CVE data
      # doesn't differ meaningfully by architecture and scanning both would
      # just double this step's runtime.
      - name: Docker Scout - CVE scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: docker.io/honeybeartech/plex-director-mcp@${{ steps.build.outputs.digest }}
          platform: linux/amd64
          only-severities: critical,high
          exit-code: false

  release:
    name: Create GitHub Release
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
