name: Secret scan

# Every push and pull request: scan the commits for API keys, tokens and other secrets with
# gitleaks. The binary is downloaded at a pinned version and checked against its published
# SHA-256 before it runs. --redact keeps any match out of the job log.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          file="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${file}"
          echo "${SHA256}  ${file}" | sha256sum -c -
          tar xzf "$file" gitleaks

      - name: Scan for secrets
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
