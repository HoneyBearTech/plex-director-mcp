name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Dependency audit
        run: npm audit --audit-level=high

  publish:
    name: Build & push Docker image
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase GHCR image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Mirrored to Docker Hub (public) alongside GHCR so pull-count/version
      # badges have a source to read from - GHCR doesn't expose that metric.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ steps.image.outputs.name }}
            docker.io/honeybeartech/plex-director-mcp
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' }}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Non-blocking for now (exit-code: false) so a baseline can be reviewed
      # before deciding whether to gate the pipeline on it. Results land in
      # this job's summary. Flip exit-code to true once you're ready to fail
      # the build on new critical/high CVEs. Pinned to amd64 since CVE data
      # doesn't differ meaningfully by architecture and scanning both would
      # just double this step's runtime.
      - name: Docker Scout - CVE scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: docker.io/honeybeartech/plex-director-mcp@${{ steps.build.outputs.digest }}
          platform: linux/amd64
          only-severities: critical,high
          exit-code: false

  release:
    name: Create GitHub Release
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
